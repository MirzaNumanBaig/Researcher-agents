name: Tests
on:
  pull_request:
  push:
    paths: [agents/**, tests/**]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pillow  # the image pipeline tests and the finishing step need Pillow
      - run: python -m unittest discover tests

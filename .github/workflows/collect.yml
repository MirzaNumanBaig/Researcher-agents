name: Collect news
on:
  schedule: [{cron: "0 * * * *"}]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [config.json]
concurrency: {group: repo-writes, cancel-in-progress: false}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Check schedule and pause switch
        id: gate
        run: python agents/gate.py >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.run == 'yes'
        run: python agents/collect_news.py
      - name: Fetch the image link of every story (feed image or the article's og:image)
        continue-on-error: true
        run: python agents/fetch_images.py
      - run: python agents/build_dashboard.py
      - run: python agents/make_briefs.py
      - name: Commit results
        run: |
          git config user.name "researcher-bot"
          git config user.email "researcher-bot@users.noreply.github.com"
          git add data docs briefs
          git diff --cached --quiet || { git commit -m "Update leads" && bash scripts/push_retry.sh; }

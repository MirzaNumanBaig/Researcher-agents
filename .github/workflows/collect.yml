name: Collect news
on:
  schedule: [{cron: "0 */3 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python agents/collect_news.py
      - run: python agents/build_dashboard.py
      - name: Commit results
        run: |
          git config user.name "researcher-bot"
          git config user.email "researcher-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Update leads" && git push

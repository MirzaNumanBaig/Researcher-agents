name: Send approved articles to WordPress
on:
  schedule: [{cron: "17 * * * *"}]  # hourly: checks WordPress so trashed/deleted posts and the dashboard numbers stay true
  workflow_dispatch:
  push:
    branches: [main]
    paths: [articles/**]
permissions:
  contents: write
  issues: write
concurrency: {group: wordpress, cancel-in-progress: false}  # shared with the publish job in write-articles.yml
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HAS_CLAUDE1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      HAS_CLAUDE2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 != '' }}
      HAS_CLAUDE3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 != '' }}
      HAS_CODEX: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Generate featured images (Cloudflare Workers AI, 1600x900 WebP; skipped when the secrets are not set)
        continue-on-error: true
        run: |
          pip install -q pillow
          python agents/generate_images.py --max 25
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - name: Self-test the publisher
        run: python -m unittest discover tests
      - id: send
        run: python agents/publish_wordpress.py
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      - name: Commit WordPress ids
        if: always()
        run: |
          git config user.name "researcher-bot"
          git config user.email "researcher-bot@users.noreply.github.com"
          git add articles
          [ -f data/wp_sync.json ] && git add data/wp_sync.json || true
          git diff --cached --quiet || { git commit -m "Update article WordPress status" && bash scripts/push_retry.sh; }
      - name: Refresh the dashboard
        if: always()
        run: bash scripts/push_dashboard.sh
      - name: Alert when sending failed
        if: always() && steps.send.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          n=$(gh issue list --label publish-failure --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "Still failing: $url"
          else gh issue create --label publish-failure --title "WordPress publishing is failing" --body "Articles are not reaching WordPress. See the FAIL lines in $url"; fi

name: Write articles
# After every collection run: one Claude job per brief (one celebrity, one batch) writes one article,
# then GitHub sends the new articles to WordPress (as config.json wp_default_status, "pending" = review).
on:
  workflow_run:
    workflows: ["Collect news"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency: write-articles
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      queue: ${{ steps.q.outputs.queue }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Refresh WordPress categories, tags and recent posts
        continue-on-error: true
        run: python agents/fetch_wp_site.py
        env:
          WP_URL: ${{ secrets.WP_URL }}
      - id: q
        run: echo "queue=$(python agents/pending_briefs.py)" >> "$GITHUB_OUTPUT"
      - name: Save the site snapshot
        run: |
          git config user.name "researcher-bot"
          git config user.email "researcher-bot@users.noreply.github.com"
          git add data/wp_site.json || true
          git diff --cached --quiet || { git commit -m "Update WordPress site snapshot" && git pull --rebase origin main && git push; }

  write:
    needs: plan
    if: needs.plan.outputs.queue != '[]' && needs.plan.outputs.queue != ''
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1   # one brief after another
      fail-fast: false
      matrix:
        item: ${{ fromJson(needs.plan.outputs.queue) }}
    env:
      # Writers are tried in this order until one produces the article. Add or remove secrets to change who writes.
      HAS_CLAUDE1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      HAS_CLAUDE2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 != '' }}
      HAS_CLAUDE3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 != '' }}
      HAS_CODEX: ${{ secrets.OPENAI_API_KEY != '' }}
      ARTICLE: ${{ matrix.item.article }}
      PROMPT: |
        Follow prompts/article.md exactly.
        Brief: ${{ matrix.item.brief }}
        Source texts (already downloaded): ${{ matrix.item.sources }}
        Save the article to: ${{ matrix.item.article }}
        wp_status to use: ${{ matrix.item.wp_status }}
        Celebrity: ${{ matrix.item.celebrity }}   Batch: ${{ matrix.item.batch }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Download the source pages for this brief
        continue-on-error: true
        run: python agents/fetch_sources.py "${{ matrix.item.brief }}"

      - name: "Writer 1: Claude account 1"
        id: c1
        if: env.HAS_CLAUDE1 == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ env.PROMPT }}
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"
      - id: d1
        run: test -s "$ARTICLE" && echo done=true >> "$GITHUB_OUTPUT" || echo done=false >> "$GITHUB_OUTPUT"

      - name: "Writer 2: Claude account 2 (if account 1 failed or hit its limit)"
        id: c2
        if: steps.d1.outputs.done != 'true' && env.HAS_CLAUDE2 == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ env.PROMPT }}
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"
      - id: d2
        run: test -s "$ARTICLE" && echo done=true >> "$GITHUB_OUTPUT" || echo done=false >> "$GITHUB_OUTPUT"

      - name: "Writer 3: Claude account 3"
        id: c3
        if: steps.d2.outputs.done != 'true' && env.HAS_CLAUDE3 == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ env.PROMPT }}
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"
      - id: d3
        run: test -s "$ARTICLE" && echo done=true >> "$GITHUB_OUTPUT" || echo done=false >> "$GITHUB_OUTPUT"

      - name: "Writer 4: OpenAI Codex (if every Claude account failed)"
        if: steps.d3.outputs.done != 'true' && env.HAS_CODEX == 'true'
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: ${{ env.PROMPT }}

      - name: Save the article
        run: |
          git config user.name "researcher-bot"
          git config user.email "researcher-bot@users.noreply.github.com"
          git add articles
          git diff --cached --quiet || { git commit -m "Draft: ${{ matrix.item.celebrity }} (${{ matrix.item.batch }})" && git pull --rebase origin main && git push; }

  publish:
    needs: [plan, write]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Send to WordPress
        run: |
          if [ "$(python -c "import json;print(json.load(open('config.json')).get('auto_send',False))")" = "True" ]; then
            python agents/publish_wordpress.py --auto-approve
          else
            python agents/publish_wordpress.py
          fi
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      - name: Save WordPress ids
        if: always()
        run: |
          git config user.name "researcher-bot"
          git config user.email "researcher-bot@users.noreply.github.com"
          git add articles
          git diff --cached --quiet || { git commit -m "Update article WordPress status" && git pull --rebase origin main && git push; }
